[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lazyqsar"
version = "3.5.0"
description = "A library to quickly build QSAR models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPLv3" }
authors = [
  { name = "Ersilia Open Source Initiative", email = "hello@ersilia.io" },
  { name = "Gemma Turon Rodrigo", email = "gemma@ersilia.io" },
  { name = "Abel Legese Shibiru", email = "abel@ersilia.io" },
  { name = "Miquel Duran Frigola", email = "miquel@ersilia.io" },
]
keywords = ["qsar", "machine-learning", "chemistry", "computer-aided-drug-design"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==2.1.3",
    "onnxruntime==1.20.1",
    "pandas==2.3.0",
    "h5py==3.14.0",
    "psutil==7.0.0",
    "rich==14.1.0",
    "loguru==0.7.3",
]

[project.optional-dependencies]
fit = [
    "scikit-learn==1.9.1",
    "xgboost==3.2.0",
    "scipy",
    "onnxmltools==1.16.0",
    "onnxconverter-common==1.16.0",
    "skl2onnx==1.19.1",
    "joblib==1.5.1",
]
descriptors = [
    "rdkit==2025.9.1",
    "FPSim2==0.7.3",
    "torch>=2.6.0",
    "chemprop==2.2.3",
    "chemeleon==0.1.3",
    "jinja2==3.1.4",
    "markupsafe==3.0.2",
    "tabulate==0.9.0",
]
all = [
    "lazyqsar[fit,descriptors]",
]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    # pytest-cov 7 requires coverage>=7.10.6; the CI combine job must not pin below it.
    "coverage[toml]==7.16.1",
    "pytest-xdist==3.8.0",
]

[project.urls]
"Source Code" = "https://github.com/ersilia-os/lazy-qsar"

[project.scripts]
lazyqsar = "lazyqsar.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So tests can `from _helpers.stubs import ...` from any subdirectory. The old suite relied
# on pytest inserting the rootdir, which breaks as soon as tests live in subpackages.
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config --durations=15"
markers = [
  "fit: requires the [fit] extra (scikit-learn, xgboost, skl2onnx, scipy, joblib)",
  "chem: requires RDKit (the [descriptors] extra)",
  "deep: requires torch / chemprop / chemeleon",
  "network: downloads model checkpoints",
  "slow: takes more than a second or so",
]
# No `-m` default: a default deselect is how a whole tier stays broken for a month unnoticed.

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly rather than left implicit.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `pytest.importorskip` and stub installation must run before the imports they guard.
"tests/*" = ["E402"]

[tool.coverage.run]
source_pkgs = ["lazyqsar"]
branch = true
parallel = true
# Load-bearing for combining across CI jobs: without it, the same module reached via the
# source tree and via site-packages are two different files to `coverage combine`.
relative_files = true

[tool.coverage.paths]
source = ["lazyqsar", "*/site-packages/lazyqsar"]
