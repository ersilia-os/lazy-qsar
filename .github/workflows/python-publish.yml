name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs the full suite inside this same workflow run, so the artifact that gets published
  # is byte-identical to the one that was tested. Previously a release shipped a wheel that
  # no job had ever imported.
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Assert, do not rewrite. The old workflow ran `poetry version $TAG`, which let
      # pyproject.toml and what PyPI serves drift apart silently.
      - name: Tag must match [project].version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if declared != tag:
              raise SystemExit(f"pyproject.toml says {declared}, the tag says {tag}")
          print("version ok:", declared)
          PY

  publish:
    needs: [ci, check-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/lazyqsar
    permissions:
      # Trusted Publishing, so no long-lived token lives in a workflow that any
      # workflow_dispatch can trigger.
      id-token: write
    steps:
      # Same run, so the reusable workflow's build artifact is visible here.
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
