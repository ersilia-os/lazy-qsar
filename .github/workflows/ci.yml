name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

# Cancel superseded PR runs, but never cancel a run a release is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUFF_VERSION: "0.14.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the changed-files ratchet needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${RUFF_VERSION}"

      # Gate 1: the standard this repo already maintains.
      - name: Format check
        run: ruff format --check lazyqsar tests dev

      # Gate 2: bugs, not style. These must be zero on any healthy tree.
      - name: Lint (errors only, whole repo)
        run: ruff check --select E9,F821,F822,F823 lazyqsar tests dev

      # Gate 3: the ratchet. Full rule set, but only on what this PR touched, so the
      # pre-existing findings in lazyqsar/ never block an unrelated change.
      - name: Lint changed files (full rule set)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=ACMR \
                    "origin/${{ github.base_ref }}"...HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "no python files changed"; else ruff check $FILES; fi

      # Visible and non-blocking, so the debt is seen shrinking instead of forgotten.
      - name: Lint debt (informational)
        if: always()
        run: |
          { echo '### Ruff debt (whole repo, not gating)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ruff check --statistics lazyqsar >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # poetry-core discovers packages implicitly; if that ever breaks, an empty wheel
      # would sail through every other job because the source tree is also importable.
      - name: Assert the wheel actually contains the package
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = [n for n in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
                   if n.startswith("lazyqsar/") and n.endswith(".py")]
          print(len(names), "modules in the wheel")
          sys.exit(0 if len(names) > 50 else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  base:
    # The Ersilia Model Hub deployment contract, as a real environment rather than an
    # in-process import blocker.
    name: base (py${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      COVERAGE_FILE: .coverage.base-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # The tier is part of the key: a shared key would let this job's small cache
          # overwrite the one the fit job needs.
          key: pip-${{ runner.os }}-py${{ matrix.python }}-base-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python }}-base-

      - name: Install the wheel (core dependencies only)
        run: pip install "$(ls dist/*.whl)[test]"

      - name: Assert the environment is genuinely minimal
        run: |
          python - <<'PY'
          import importlib.util as u, sys
          banned = ["sklearn", "xgboost", "skl2onnx", "onnxmltools", "rdkit", "torch",
                    "chemprop", "chemeleon", "scipy", "joblib", "FPSim2"]
          leaked = [b for b in banned if u.find_spec(b) is not None]
          print("leaked:", leaked)
          sys.exit(1 if leaked else 0)
          PY

      # A stricter contract than "nothing banned is importable": everything the code needs
      # must be present in what an Ersilia template actually installs.
      - name: Ersilia template smoke (--no-deps)
        run: |
          python -m venv /tmp/ersilia-env
          /tmp/ersilia-env/bin/pip install -q numpy==2.1.3 onnxruntime==1.20.1 \
                                              pandas==2.3.0 rich==14.1.0 loguru==0.7.3 \
                                              h5py==3.14.0 psutil==7.0.0
          /tmp/ersilia-env/bin/pip install -q --no-deps "$(ls dist/*.whl)"
          /tmp/ersilia-env/bin/python -c "
          import lazyqsar.api.classifier_predict, lazyqsar.registry, lazyqsar.ensemble.runner
          print('the inference path imports on a template install')"

      # `pytest`, never `python -m pytest`: the latter puts the repo root on sys.path and
      # would shadow the installed wheel with the source tree.
      - name: Tests (base-install subset)
        run: pytest -m "not fit and not chem and not deep and not network" --cov --cov-report=

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-base-${{ matrix.python }}
          path: .coverage.base-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: ignore

  fit:
    name: fit (py${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      COVERAGE_FILE: .coverage.fit-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python }}-fit-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py${{ matrix.python }}-fit-

      - name: Install the wheel with [fit]
        run: pip install "$(ls dist/*.whl)[fit,test]"

      # The package pins OMP_NUM_THREADS=1, so each fit is single-threaded and the other
      # vCPUs are idle. loadfile (not load) keeps a module's session checkpoint on one
      # worker instead of rebuilding it per worker.
      - name: Tests
        run: pytest -m "not chem and not deep and not network" -n auto --dist loadfile --cov --cov-report=

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-fit-${{ matrix.python }}
          path: .coverage.fit-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: ignore

  chem:
    # Real chemistry without torch. rdkit and FPSim2 are cheap wheels and between them
    # cover morgan, rdkit, clamp and cddd -- four of the five descriptors. Only chemeleon
    # needs torch, which is why torch is fair to leave to the nightly run.
    name: chem (fit + rdkit)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVERAGE_FILE: .coverage.chem-3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-chem-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py3.12-chem-

      - name: Install the wheel with [fit] plus rdkit and FPSim2
        run: pip install "$(ls dist/*.whl)[fit,test]" "rdkit==2025.9.1" "FPSim2==0.7.3"

      - name: Assert torch did not sneak in
        run: python -c "import importlib.util as u,sys; sys.exit(1 if u.find_spec('torch') else 0)"

      - name: Tests
        run: pytest -m "not deep and not network" -n auto --dist loadfile --cov --cov-report=

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-chem-3.12
          path: .coverage.chem-3.12
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    # Each tier can only reach part of the package, so a per-job number is misleading.
    # The combined figure is the real one.
    name: coverage
    needs: [base, fit, chem]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Must not be older than what pytest-cov wrote the data files with.
      - run: pip install "coverage[toml]==7.16.1"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        run: |
          coverage combine || true
          { echo '### Coverage (base + fit + chem combined)'; echo; } >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-xml, path: coverage.xml, if-no-files-found: ignore }

  ci-ok:
    # One required status check, so branch protection needs a single entry and adding a
    # matrix entry does not mean editing the protection rule.
    name: ci-ok
    if: always()
    needs: [lint, build, base, fit, chem, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            exit 1
          fi
