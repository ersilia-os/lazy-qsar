name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Also run network tests (refreshes the checkpoint cache)"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-wide:
    # The supported window is 3.11-3.13 and the PR run covers 3.11 and 3.12, so what this
    # job adds is the 3.13 probe. The supported versions are repeated here anyway: a
    # nightly that only ever ran the experimental entry would go green on a broken 3.12.
    name: fit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        experimental: [false]
        include:
          # A probe, not a promise. This job installs [fit,test] only, so what it proves
          # is that sklearn, xgboost, skl2onnx and onnxruntime resolve and pass on 3.13 --
          # the descriptors job below stays on 3.12 because chemprop and chemeleon are the
          # likely blockers. Promote this after it has been green for a fortnight, and add
          # the classifier to pyproject.toml at the same time.
          - python: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python }}-fit-${{ hashFiles('pyproject.toml') }}
      - run: pip install ".[fit,test]"
      - run: pytest -m "not chem and not deep and not network" -n auto --dist loadfile

  descriptors:
    # The expensive tier: torch, chemprop, chemeleon and the downloaded checkpoints.
    name: descriptors (full, CPU torch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-all-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-py3.12-all-

      # These two files are the checkpoint URL manifest, so hashing them invalidates the
      # cache exactly when a checkpoint changes.
      - uses: actions/cache@v4
        id: ckpt
        with:
          path: ~/.lazyqsar
          key: lazyqsar-ckpt-${{ hashFiles('lazyqsar/utils/checkpoints.py', 'lazyqsar/utils/setup.py') }}

      # CPU torch first, and --index-url rather than --extra-index-url: with two indexes
      # pip is free to pick PyPI's ~2.5 GB CUDA wheel, which is the failure being avoided.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      # torch==2.6.0 already satisfies torch>=2.6.0, so the resolver leaves it alone.
      - name: Install [all]
        run: pip install ".[all,test]"

      - name: Assert torch is the CPU build
        run: |
          python - <<'PY'
          import sys, torch
          print(torch.__version__)
          sys.exit(0 if torch.__version__.endswith("+cpu") else 1)
          PY

      - run: df -h /

      # Offline by default: a Zenodo or S3 outage must not redden the nightly.
      - name: Tests (offline, cached checkpoints)
        run: pytest -m "not network" -n auto --dist loadfile

      - name: Tests (network, refreshes checkpoints)
        if: inputs.network || steps.ckpt.outputs.cache-hit != 'true'
        run: |
          lazyqsar setup --descriptors --cpu-torch --only chemeleon,clamp
          # Exit 5 is "no tests collected". Nothing carries the `network` marker yet, and a
          # cache refresh must not redden the nightly just because that tier is still empty.
          pytest -m network || [ $? -eq 5 ]
